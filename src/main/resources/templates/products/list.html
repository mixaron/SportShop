<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Товары</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<th:block th:replace="~{header :: header}"/>
<div class="container mt-5">
    <h1>Товары</h1>
    <form th:action="@{/products}" class="mb-3">
        <div class="input-group">
            <input type="text" name="query" class="form-control" placeholder="Поиск...">
            <select name="categoryId" class="form-select">
                <option value="">Все категории</option>
                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
            </select>
            <button type="submit" class="btn btn-primary">Фильтр</button>
        </div>
    </form>
    <div class="row">
        <div th:each="product : ${products}" class="col-md-4">
            <div class="card mb-3">
                <div th:if="${product.image != null}">
                    <img th:src="@{|/products/${product.id}/image|}" class="card-img-top" alt="Product"/>
                </div>
                <div class="card-body">
                    <h5 class="card-title" th:text="${product.name}"></h5>
                    <p class="card-text" th:text="${product.price} + ' ₽'"></p>
                    <a th:href="@{/products/{id}(id=${product.id})}" class="btn btn-primary">Подробнее</a>
                    <form th:action="@{/cart/add}" method="post" th:if="${#authentication.isAuthenticated()}">
                        <input type="hidden" name="productId" th:value="${product.id}">
                        <input type="number" name="quantity" value="1" min="1" class="form-control d-inline w-auto">
                        <button type="submit" class="btn btn-success">В корзину</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
