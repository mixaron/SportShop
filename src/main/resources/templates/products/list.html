<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>Товары</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<th:block th:replace="~{header :: header}"/>
<div class="container mt-5">
    <h1 class="text-center mb-4">Товары</h1>
    <form th:action="@{/products}" class="mb-4">
        <div class="row g-3">
            <div class="col-12 col-md-6">
                <input type="text" name="query" class="form-control" placeholder="Поиск...">
            </div>
            <div class="col-12 col-md-4">
                <select name="categoryId" class="form-select">
                    <option value="">Все категории</option>
                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                </select>
            </div>
            <div class="col-12 col-md-2">
                <button type="submit" class="btn btn-primary w-100">Фильтр</button>
            </div>
        </div>
    </form>
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
        <div th:each="product : ${products}" class="col">
            <div class="card h-100">
                <div th:if="${product.image != null}">
                    <img th:src="@{|/products/${product.id}/image|}" class="card-img-top" alt="Product"/>
                </div>
                <div class="card-body">
                    <h5 class="card-title" th:text="${product.name}"></h5>
                    <p class="card-text" th:text="${product.price} + ' ₽'"></p>
                    <a th:href="@{/products/{id}(id=${product.id})}" class="btn btn-primary">Подробнее</a>
                    <div class="mt-2" sec:authorize="isAuthenticated()">
                        <div class="input-group">
                            <input type="number" th:id="'quantity-' + ${product.id}" value="1" min="1" class="form-control">
                            <button type="button"
                                    th:onclick="'addToCart(' + ${product.id} + ')'"
                                    th:id="'add-btn-' + ${product.id}"
                                    class="btn btn-success">В корзину</button>
                        </div>
                    </div>
                    <div class="mt-2" sec:authorize="!isAuthenticated()">
                        <a th:href="@{/auth/login}" class="btn btn-outline-secondary">Войдите, чтобы добавить</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    function addToCart(productId) {
        var quantity = $('#quantity-' + productId).val();
        var button = $('#add-btn-' + productId);

        $.ajax({
            url: '/cart/add',
            type: 'POST',
            data: {
                productId: productId,
                quantity: quantity,
                _csrf: $('input[name="_csrf"]').val()
            },
            success: function(response) {
                button.text('Добавлено').prop('disabled', true).removeClass('btn-success').addClass('btn-secondary');
                setTimeout(function() {
                    button.text('В корзину').prop('disabled', false).removeClass('btn-secondary').addClass('btn-success');
                }, 2000);
            },
            error: function() {
                alert('Ошибка при добавлении в корзину');
            }
        });
    }
</script>
</body>
</html>
