<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Товары</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 70px;
        }

        .card-body h5,
        .card-body p.card-text {
            text-align: center;
        }

        .product-image-container {
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: #f8f9fa;
        }

        .product-image-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>
<th:block th:replace="~{header :: header}"/>

<div class="container py-4">
    <h1 class="text-center mb-4">Товары</h1>

    <form th:action="@{/products}" class="mb-4">
        <div class="row g-3">
            <div class="col-12 col-md-6">
                <input type="text" name="query" class="form-control"
                       placeholder="Поиск..." th:value="${query}">
            </div>
            <div class="col-12 col-md-4">
                <select name="categoryId" class="form-select">
                    <option value="">Все категории</option>
                    <option th:each="cat : ${categories}"
                            th:value="${cat.id}"
                            th:selected="${selectedCategoryId == cat.id}"
                            th:text="${cat.name}">
                    </option>
                </select>
            </div>
            <div class="col-12 col-md-2">
                <button type="submit" class="btn btn-primary w-100">Фильтр</button>
            </div>
        </div>
    </form>


    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
        <div th:each="product : ${products}" class="col d-flex">
            <div class="card flex-fill h-100">
                <div th:if="${product.image != null}" class="product-image-container">
                    <img th:src="@{|/products/${product.id}/image|}" alt="Product"/>
                </div>
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title" th:text="${product.name}"></h5>
                    <p class="card-text mb-2" th:text="${product.price} + ' ₽'"></p>

                    <a th:href="@{/products/{id}(id=${product.id})}" class="btn btn-primary mt-auto">Подробнее</a>

                    <div class="mt-3" sec:authorize="isAuthenticated()">
                        <div class="input-group">
                            <input type="number" th:id="'quantity-' + ${product.id}" value="1" min="1" class="form-control">
                            <button type="button"
                                    th:onclick="'addToCart(' + ${product.id} + ')'"
                                    th:id="'add-btn-' + ${product.id}"
                                    class="btn btn-success">Добавить в корзину</button>
                        </div>
                    </div>

                    <div class="mt-2" sec:authorize="!isAuthenticated()">
                        <a th:href="@{/auth/login}" class="btn btn-outline-secondary w-100">Войдите, чтобы добавить</a>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    function addToCart(productId) {
        var quantity = $('#quantity-' + productId).val();
        var button = $('#add-btn-' + productId);

        $.ajax({
            url: '/cart/add',
            type: 'POST',
            data: {
                productId: productId,
                quantity: quantity,
                _csrf: $('input[name="_csrf"]').val()
            },
            success: function () {
                button.replaceWith(
                    `<a href="/cart" class="btn btn-secondary w-100">Перейти в корзину</a>`
                );
            },
            error: function () {
                alert('Ошибка при добавлении в корзину');
            }
        });
    }

</script>
</body>
</html>
