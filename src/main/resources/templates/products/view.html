<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title th:text="${product.name}">Товар</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<th:block th:replace="~{header :: header}"/>
<div class="container mt-5">

  <h1 th:text="${product.name}"></h1>
  <p><strong>Категория:</strong> <span th:text="${product.category.name}"></span></p>
  <p><strong>Цена:</strong> <span th:text="${product.price} + ' ₽'"></span></p>
  <p><strong>Описание:</strong> <span th:text="${product.description}"></span></p>

  <div th:if="${product.image != null}" class="mb-3">
    <img th:src="@{|/products/${product.id}/image|}" alt="product" style="max-width: 300px;">
  </div>

  <hr>

  <h3>Отзывы</h3>

  <div th:each="review : ${product.reviews}">
    <div class="mb-2 border rounded p-2">
      <p>Пользователь написал:</p>
      <p th:text="${review.comment}"></p>
      <small th:text="'Оценка: ' + ${review.rating} + ' ★ | ' + ${#temporals.format(review.createdAt, 'dd.MM.yyyy HH:mm')}"></small>
    </div>
  </div>

  <div th:if="${isUserBuy}">
    <hr>

    <div th:if="${hasUserReview}">
      <h4>Редактировать отзыв</h4>
      <form th:action="@{/review/edit}" th:object="${userReview}" method="post">
        <input type="hidden" name="productId" th:value="${product.id}" />

        <div class="mb-3">
          <label class="form-label">Оценка (1-5)</label>
          <input type="number" th:field="*{rating}" min="1" max="5" class="form-control" required/>
        </div>

        <div class="mb-3">
          <label class="form-label">Комментарий</label>
          <textarea th:field="*{comment}" class="form-control" rows="3" required></textarea>
        </div>

        <button type="submit" class="btn btn-warning">Обновить</button>
      </form>

      <form th:action="@{/review/delete/{productId}(productId=${product.id})}" method="post">
        <button type="submit" class="btn btn-danger">Удалить отзыв</button>
      </form>
    </div>

    <div th:unless="${hasUserReview}">
      <h4>Оставить отзыв</h4>
      <form th:action="@{/review}" th:object="${review}" method="post">
        <input type="hidden" name="productId" th:value="${product.id}" />

        <div class="mb-3">
          <label class="form-label">Оценка (1-5)</label>
          <input type="number" th:field="*{rating}" min="1" max="5" class="form-control" required/>
        </div>

        <div class="mb-3">
          <label class="form-label">Комментарий</label>
          <textarea th:field="*{comment}" class="form-control" rows="3" required></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Отправить</button>
      </form>
    </div>
  </div>


  <div th:unless="${isUserBuy}" class="alert alert-warning mt-4">
    Только покупатели могут оставлять отзывы.
  </div>
</div>
</body>
</html>
