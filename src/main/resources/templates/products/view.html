<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title th:text="${product.name}"></title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<th:block th:replace="~{header :: header}"/>
<div class="container mt-5">
  <h1 th:text="${product.name}"></h1>
  <div class="row">
    <div class="col-md-6">
      <div th:if="${product.image != null}">
        <img th:src="@{|/products/${product.id}/image|}" class="img-fluid" alt="Product"/>
      </div>
      <div th:unless="${product.image != null}" class="text-muted">
        Изображение отсутствует
      </div>
    </div>
    <div class="col-md-6">
      <p><strong>Категория:</strong> <span th:text="${product.category.name}"></span></p>
      <p><strong>Цена:</strong> <span th:text="${product.price} + ' ₽'"></span></p>
      <p><strong>Статус:</strong> <span th:text="${product.status}"></span></p>
      <p><strong>Создано:</strong> <span th:text="${#temporals.format(product.createdAt, 'dd.MM.yyyy HH:mm')}"></span></p>
      <form th:action="@{/cart/add}" method="post" th:if="${#authentication.isAuthenticated()}">
        <input type="hidden" name="productId" th:value="${product.id}">
        <div class="input-group mb-3">
          <input type="number" name="quantity" value="1" min="1" class="form-control w-25">
          <button type="submit" class="btn btn-success">В корзину</button>
        </div>
      </form>
      <a th:href="@{/products}" class="btn btn-secondary">Назад</a>
    </div>
  </div>
</div>
</body>
</html>
