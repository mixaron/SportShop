<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
</head>
<body>
<h2>Login</h2>

<form th:action="@{/auth/login}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <input type="text" name="username" placeholder="Email" /><br/>
    <input type="password" name="password" placeholder="Password" /><br/>
    <button type="submit">Login</button>
</form>
<a th:href="@{/auth/forgot-password.html}">Забыли пароль?</a>

<h3>Или войдите через:</h3>
<a th:href="@{/oauth2/authorization/google}">Google</a><br/>
<a th:href="@{/oauth2/authorization/github}">GitHub</a>

<div th:if="${param.error}">
    <p style="color:red">Неверный логин или пароль</p>
</div>
</body>
</html>
