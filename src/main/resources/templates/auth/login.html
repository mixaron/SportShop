<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Вход</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
<th:block th:replace="~{header :: header}"/>
<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="col-12 col-sm-8 col-md-6 col-lg-4">
        <h2 class="text-center mb-4">Вход</h2>
        <form th:action="@{/auth/login}" method="post" class="p-4 bg-light rounded shadow-sm">
            <div class="mb-3">
                <label for="username" class="form-label">Email</label>
                <input type="email" name="username" id="username" class="form-control" placeholder="Введите email" required/>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Пароль</label>
                <input type="password" name="password" id="password" class="form-control" placeholder="Введите пароль" required/>
            </div>
            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary">Войти</button>
            </div>
            <div class="text-center">
                <a th:href="@{/auth/forgot-password}" class="text-decoration-none">Забыли пароль?</a>
            </div>
            <div th:if="${param.error}" class="alert alert-danger mt-3">
                Неверный email или пароль
            </div>
        </form>
        <div class="text-center mt-4">
            <h5>Или войдите через:</h5>
            <div class="d-flex justify-content-center gap-3">
                <a th:href="@{/oauth2/authorization/google}" class="btn btn-outline-primary">Google</a>
                <a th:href="@{/oauth2/authorization/github}" class="btn btn-outline-dark">GitHub</a>
            </div>
        </div>
        <div class="text-center mt-3">
            <p>Нет аккаунта? <a th:href="@{/auth/register}" class="text-decoration-none">Зарегистрируйтесь</a></p>
        </div>
    </div>
</div>
</body>
</html>
