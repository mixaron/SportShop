<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Регистрация</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
<th:block th:replace="~{header :: header}"/>
<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="col-12 col-sm-8 col-md-6 col-lg-4">
    <h2 class="text-center mb-4">Регистрация</h2>
    <form th:action="@{/auth/register}" method="post" class="p-4 bg-light rounded shadow-sm">
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" name="email" id="email" class="form-control" placeholder="Введите email" required/>
      </div>
      <div class="mb-3">
        <label for="firstName" class="form-label">firstName</label>
        <input type="text" name="firstName" id="firstName" class="form-control" placeholder="Введите имя" required/>
      </div>
      <div class="mb-3">
        <label for="lastName" class="form-label">lastName</label>
        <input type="text" name="lastName" id="lastName" class="form-control" placeholder="Введите фамилию" required/>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Пароль</label>
        <input type="password" name="password" id="password" class="form-control" placeholder="Введите пароль" required/>
      </div>
      <div class="mb-3">
        <label for="confirmPassword" class="form-label">Подтвердите пароль</label>
        <input type="password" name="confirmPassword" id="confirmPassword" class="form-control" placeholder="Повторите пароль" required/>
      </div>
      <div class="d-grid mb-3">
        <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
      </div>
      <div th:if="${error}" class="alert alert-danger mt-3" th:text="${error}"></div>
    </form>
    <div class="text-center mt-3">
      <p>Уже есть аккаунт? <a th:href="@{/auth/login}" class="text-decoration-none">Войдите</a></p>
    </div>
  </div>
</div>
</body>
</html>
