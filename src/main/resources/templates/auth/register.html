<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Регистрация</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<th:block th:replace="~{header :: header}"/>
<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="col-12 col-sm-8 col-md-6 col-lg-4">
    <h2 class="text-center mb-4">Регистрация</h2>

    <form th:action="@{/auth/register}" th:object="${userDto}" method="post"
          class="p-4 bg-light rounded shadow-sm">

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" th:field="*{email}" id="email" class="form-control" placeholder="Введите email"/>
        <div class="text-danger small" th:errors="*{email}"></div>
      </div>

      <div class="mb-3">
        <label for="firstName" class="form-label">Имя</label>
        <input type="text" th:field="*{firstName}" id="firstName" class="form-control" placeholder="Введите имя"/>
        <div class="text-danger small" th:errors="*{firstName}"></div>
      </div>

      <div class="mb-3">
        <label for="lastName" class="form-label">Фамилия</label>
        <input type="text" th:field="*{lastName}" id="lastName" class="form-control" placeholder="Введите фамилию"/>
        <div class="text-danger small" th:errors="*{lastName}"></div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Пароль</label>
        <input type="password" th:field="*{password}" id="password" class="form-control" placeholder="Введите пароль"/>
        <div class="text-danger small" th:errors="*{password}"></div>
      </div>

      <div class="mb-3">
        <label for="confirmPassword" class="form-label">Подтвердите пароль</label>
        <input type="password" name="confirmPassword" id="confirmPassword" class="form-control" placeholder="Повторите пароль"/>
        <div class="text-danger small" th:if="${confirmError}" th:text="${confirmError}"></div>
      </div>

      <div class="d-grid mb-3">
        <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
      </div>

      <div th:if="${error}" class="alert alert-danger mt-3" th:text="${error}"></div>
    </form>

    <div class="text-center mt-3">
      <p>Уже есть аккаунт? <a th:href="@{/auth/login}" class="text-decoration-none">Войдите</a></p>
    </div>
  </div>
</div>
</body>
</html>
