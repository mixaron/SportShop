<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Корзина</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<th:block th:replace="~{header :: header}"/>
<div class="container mt-5">
    <h1>Корзина</h1>

    <div th:if="${#lists.isEmpty(cartItems)}">
        <p>Ваша корзина пуста.</p>
    </div>

    <div th:unless="${#lists.isEmpty(cartItems)}">
        <table class="table">
            <thead>
            <tr>
                <th>Изображение</th>
                <th>Товар</th>
                <th>Цена</th>
                <th>Количество</th>
                <th>Сумма</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${cartItems}">
                <td>
                    <img th:if="${item.product.image != null}"
                         th:src="@{|/products/${item.product.id}/image|}"
                         style="max-width: 50px;" alt="Product"/>
                </td>
                <td th:text="${item.product.name}"></td>
                <td th:text="${item.product.price}"></td>
                <td>
                    <form th:action="@{/cart/update}" method="post">
                        <input type="hidden" name="productId" th:value="${item.product.id}">
                        <input type="number" name="quantity" th:value="${item.quantity}" min="0"
                               class="form-control d-inline w-auto">
                        <button type="submit" class="btn btn-primary">Обновить</button>
                    </form>
                </td>
                <td th:text="${item.product.price * item.quantity}"></td>
                <td>
                    <form th:action="@{/cart/remove}" method="post">
                        <input type="hidden" name="productId" th:value="${item.product.id}">
                        <button type="submit" class="btn btn-danger">Удалить</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <form th:action="@{/order/buy}" method="post">
            <button type="submit" class="btn btn-success mt-3">Оформить заказ</button>
        </form>
    </div>
</div>
</body>
</html>
