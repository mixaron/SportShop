<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Мои заказы</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<th:block th:replace="~{header :: header}"/>
<div class="container mt-5">
    <h1>История заказов</h1>

    <div th:if="${orders.isEmpty()}">
        <p>У вас пока нет заказов.</p>
    </div>

    <div th:each="order : ${orders}" class="card mb-4">
        <div class="card-header">
            <strong>Заказ №</strong><span th:text="${order.id}"></span> |
            <strong>Дата:</strong> <span th:text="${#temporals.format(order.createdAt, 'dd.MM.yyyy HH:mm')}"></span> |
            <strong>Статус:</strong> <span th:text="${order.status.displayName}"></span>
        </div>
        <div class="card-body">
            <table class="table table-bordered">
                <thead>
                <tr>
                    <th>Товар</th>
                    <th>Количество</th>
                    <th>Цена</th>
                    <th>Сумма</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${order.items}">
                    <td>
                        <a th:href="@{/products/{id}(id=${item.product.id})}"
                           th:text="${item.product.name}"></a>
                    </td>
                    <td th:text="${item.quantity}"></td>
                    <td th:text="${item.product.price} + ' ₽'"></td>
                    <td th:text="${item.quantity * item.product.price} + ' ₽'"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
