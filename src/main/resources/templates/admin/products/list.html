<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Управление товарами</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<th:block th:replace="~{header :: header}"/>
<div class="container mt-5">
    <h1>Управление товарами</h1>
    <a th:href="@{/admin/products/create}" class="btn btn-primary mb-3">Добавить товар</a>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>Изображение</th>
            <th>Название</th>
            <th>Категория</th>
            <th>Цена</th>
            <th>Статус</th>
            <th>Создано</th>
            <th>Описание</th>
            <th>Действия</th>

        </tr>
        </thead>
        <tbody>
        <tr th:each="product : ${products}">
            <td>
                <img th:if="${product.image != null}"
                     th:src="@{|/products/${product.id}/image|}"
                     style="max-width: 50px;" alt="Product"/>
            </td>
            <td th:text="${product.name}"></td>
            <td th:text="${product.category.name}"></td>
            <td th:text="${product.price}"></td>
            <td th:text="${product.status}"></td>
            <td th:text="${#temporals.format(product.createdAt, 'dd.MM.yyyy HH:mm')}"></td>
            <td th:text="${product.description}"></td>
            <td>
                <a th:href="@{/admin/products/{id}/edit(id=${product.id})}" class="btn btn-warning btn-sm">Редактировать</a>
                <form th:action="@{/admin/products/{id}/delete(id=${product.id})}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-danger btn-sm"
                            onclick="return confirm('Удалить товар?')">Удалить</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
