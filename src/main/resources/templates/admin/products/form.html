<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${product != null and product.id != null} ? 'Редактировать товар' : 'Добавить товар'">Управление товаром</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<th:block th:replace="~{header :: header}"/>
<div class="container mt-5">
    <h1 th:text="${product != null and product.id != null} ? 'Редактировать товар' : 'Добавить товар'">Управление товаром</h1>
    <form th:action="@{/admin/products/{id}(id=${product.id})}"
          th:object="${product}" method="post" enctype="multipart/form-data"
          th:if="${product.id != null}">

        <input type="hidden" th:if="${product != null and product.id != null}" th:field="*{id}"/>

        <div class="mb-3">
            <label class="form-label">Название</label>
            <input type="text" th:field="*{name}" class="form-control" required
                   th:disabled="${product == null}"/>
        </div>
        <div class="mb-3">
            <label class="form-label">Описание</label>
            <input type="text" th:field="*{description}" class="form-control" required
                   th:disabled="${product == null}"/>
        </div>
        <div class="mb-3">
            <label class="form-label">Категория</label>
            <select name="categoryId" class="form-select" required>
                <option value="">Выберите категорию</option>
                <option th:each="cat : ${categories}"
                        th:value="${cat.id}"
                        th:text="${cat.name}"
                        th:selected="${product != null and product.category != null and cat.id == product.category.id}">
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Цена</label>
            <input type="number" th:field="*{price}" class="form-control" step="0.01" required
                   th:disabled="${product == null}"/>
        </div>

        <div class="mb-3">
            <label class="form-label">Изображение</label>
            <input type="file" name="imageFile" accept="image/*" class="form-control"/>
        </div>

        <div class="mb-3" th:if="${product != null and product.image != null}">
            <img th:src="@{|/products/${product.id}/image|}" class="img-fluid mb-3" style="max-width: 200px;"/>
        </div>

        <button type="submit" class="btn btn-primary" th:disabled="${product == null}">Сохранить</button>

    </form>

    <form th:action="@{/admin/products}"
          th:object="${product}" method="post" enctype="multipart/form-data"
          th:unless="${product.id != null}">

        <input type="hidden" th:if="${product != null and product.id != null}" th:field="*{id}"/>

        <div class="mb-3">
            <label class="form-label">Название</label>
            <input type="text" th:field="*{name}" class="form-control" required
                   th:disabled="${product == null}"/>
        </div>

        <div class="mb-3">
            <label class="form-label">Категория</label>
            <select name="categoryId" class="form-select" required>
                <option value="">Выберите категорию</option>
                <option th:each="cat : ${categories}"
                        th:value="${cat.id}"
                        th:text="${cat.name}"
                        th:selected="${product != null and product.category != null and cat.id == product.category.id}">
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Цена</label>
            <input type="number" th:field="*{price}" class="form-control" step="0.01" required
                   th:disabled="${product == null}"/>
        </div>

        <div class="mb-3">
            <label class="form-label">Изображение</label>
            <input type="file" name="imageFile" accept="image/*" class="form-control"/>
        </div>

        <div class="mb-3" th:if="${product != null and product.image != null}">
            <img th:src="@{|/products/${product.id}/image|}" class="img-fluid mb-3" style="max-width: 200px;"/>
        </div>

        <button type="submit" class="btn btn-primary" th:disabled="${product == null}">Сохранить</button>

    </form>

</div>
</body>
</html>
