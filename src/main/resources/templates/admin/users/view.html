<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Пользователи</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<th:block th:replace="~{header :: header}" />
<div class="container mt-5">
  <h1>Управление пользователями</h1>

  <div th:if="${#lists.isEmpty(users)}" class="alert alert-warning">
    Пользователи не найдены.
  </div>

  <table class="table table-striped" th:if="${!#lists.isEmpty(users)}">
    <thead>
    <tr>
      <th>Email</th>
      <th>Имя</th>
      <th>Фамилия</th>
      <th>Роль</th>
      <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="user : ${users}">
      <td th:text="${user.email}"></td>
      <td th:text="${user.firstName}"></td>
      <td th:text="${user.lastName}"></td>
      <td th:text="${user.role.getLabel()}"></td>
      <td>
        <form th:action="@{/admin/users/change-role}" method="post" class="d-inline">
          <input type="hidden" name="_method" value="patch"/>
          <input type="hidden" name="email" th:value="${user.email}"/>
          <label>
            <select name="role" class="form-select d-inline w-auto">
              <option th:selected="${user.role.name() == 'USER'}" value="USER">Пользователь</option>
              <option th:selected="${user.role.name() == 'MODERATOR'}" value="MODERATOR">Модератор</option>
              <option th:selected="${user.role.name() == 'ADMIN'}" value="ADMIN">Администратор</option>
            </select>
          </label>
          <button type="submit" class="btn btn-sm btn-warning">Изменить роль</button>
        </form>

        <form th:action="@{/admin/users/delete}" method="post" class="d-inline ms-2">
          <input type="hidden" name="_method" value="delete"/>
          <input type="hidden" name="email" th:value="${user.email}"/>
          <button type="submit" class="btn btn-sm btn-danger"
                  onclick="return confirm('Удалить пользователя?')">Удалить</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
