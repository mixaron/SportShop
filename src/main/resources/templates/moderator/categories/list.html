<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Управление категориями</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<th:block th:replace="~{header :: header}"/>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10 text-center">
            <h1 class="text-center mb-4">Управление категориями</h1>

            <div class="mb-3 text-end">
                <a th:href="@{/moderator/categories/create}" class="btn btn-primary">Добавить категорию</a>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <div class="table-responsive">
                <table class="table table-striped table-bordered align-middle">
                    <thead class="table-light text-center">
                    <tr>
                        <th>ID</th>
                        <th>Название</th>
                        <th>Описание</th>
                        <th>Действия</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="category : ${categories}" class="text-center">
                        <td th:text="${category.id}"></td>
                        <td th:text="${category.name}"></td>
                        <td th:text="${category.description}"></td>
                        <td>
                            <div class="d-flex flex-column gap-2">
                                <form th:action="@{/moderator/categories/edit}" method="get" class="d-inline">
                                    <input type="hidden" name="categoryId" th:value="${category.id}" />
                                    <button type="submit" class="btn btn-success btn-sm w-100">Редактировать</button>
                                </form>

                                <form th:action="@{/moderator/categories/{id}/delete(id=${category.id})}" method="post" class="d-inline">
                                    <input type="hidden" name="_method" value="delete"/>
                                    <button type="submit" class="btn btn-danger btn-sm w-100"
                                            onclick="return confirm('Удалить категорию?')">Удалить</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
