<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Добавить категорию</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<th:block th:replace="~{header :: header}"/>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10 text-center">
            <h1>Добавить категорию</h1>
            <form th:action="@{/moderator/categories}" th:object="${category}" method="post">
                <div class="mb-3">
                    <label class="form-label">Название категории</label>
                    <input type="text" th:field="*{name}" class="form-control" required/>
                    <div class="text-danger small" th:errors="*{name}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Описание категории</label>
                    <input type="text" th:field="*{description}" class="form-control" required/>
                </div>
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
