<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Модерация отзывов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<th:block th:replace="~{header :: header}" />
<div class="container mt-5">
    <h1>Отзывы на модерации</h1>

    <div th:if="${reviews.isEmpty()}" class="alert alert-info">
        Отзывов для модерации нет.
    </div>

    <div th:each="review : ${reviews}" class="card mb-3">
        <div class="card-body">
            <h5 class="card-title" th:text="${review.product.name}">Название товара</h5>
            <p class="card-text"><strong>Пользователь:</strong> <span th:text="${review.user.email}">email@example.com</span></p>
            <p class="card-text"><strong>Оценка:</strong> <span th:text="${review.rating}">5</span> ★</p>
            <p class="card-text"><strong>Комментарий:</strong> <span th:text="${review.comment}">Комментарий</span></p>
            <p class="card-text"><strong>Дата:</strong> <span th:text="${#temporals.format(review.createdAt, 'dd.MM.yyyy HH:mm')}"></span></p>

            <p class="card-text">
                <strong>Статус:</strong>
                <span th:if="${review.status.name() == 'PROCESSING'}" class="badge bg-warning text-dark">На рассмотрении</span>
                <span th:if="${review.status.name() == 'APPROVED'}" class="badge bg-success">Одобрен</span>
                <span th:if="${review.status.name() == 'REJECTED'}" class="badge bg-danger">Отклонён</span>
            </p>

            <div th:if="${review.status.name() == 'PROCESSING'}">
                <form th:action="@{/moderator/reviews}" method="post" class="d-flex gap-2 mt-3">
                    <input type="hidden" name="_method" value="patch"/>
                    <input type="hidden" name="reviewId" th:value="${review.id}" />
                    <button type="submit" name="status" value="APPROVED" class="btn btn-success">Одобрить</button>
                    <button type="submit" name="status" value="REJECTED" class="btn btn-danger"
                            onclick="return confirm('Вы уверены, что хотите отклонить отзыв?')">Отклонить</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
