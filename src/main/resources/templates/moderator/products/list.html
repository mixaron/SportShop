<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Управление товарами</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<th:block th:replace="~{header :: header}"/>
<div class="container mt-5">
    <h1 class="mb-4 text-center">Управление товарами</h1>

    <div class="mb-3 text-end">
        <a th:href="@{/moderator/products/create}" class="btn btn-primary">Добавить товар</a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-bordered align-middle">
            <thead class="table-light">
            <tr class="text-center">
                <th>Изображение</th>
                <th>Название</th>
                <th>Категория</th>
                <th>Цена</th>
                <th>Создано</th>
                <th>Описание</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="product : ${products}" class="text-center align-middle">
                <td>
                    <img th:if="${product.image != null}"
                         th:src="@{|/products/${product.id}/image|}"
                         class="img-thumbnail" style="max-width: 50px;" alt="Product"/>
                </td>
                <td th:text="${product.name}"></td>
                <td th:text="${product.category.name}"></td>
                <td th:text="${product.price} + ' ₽'"></td>
                <td th:text="${#temporals.format(product.createdAt, 'dd.MM.yyyy HH:mm')}"></td>
                <td th:text="${product.description}"></td>
                <td>
                    <div class="d-flex flex-column gap-2">
                        <a th:href="@{/moderator/products/{id}/edit(id=${product.id})}"
                           class="btn btn-warning btn-sm w-100">Редактировать</a>
                        <form th:action="@{/moderator/products/{id}/delete(id=${product.id})}"
                              method="post" class="d-inline">
                            <input type="hidden" name="_method" value="delete"/>
                            <button type="submit" class="btn btn-danger btn-sm w-100"
                                    onclick="return confirm('Удалить товар?')">Удалить</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
