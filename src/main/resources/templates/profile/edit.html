<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Редактировать профиль</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<th:block th:replace="~{header :: header}"/>
<div class="container mt-5">
  <h2>Редактировать профиль</h2>

  <form th:action="@{/profile/edit}" method="post" th:object="${user}">
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" th:field="*{email}" class="form-control" id="email" required>
    </div>

    <div class="mb-3">
      <label for="password" class="form-label">Новый пароль</label>
      <input type="password" th:field="*{password}" class="form-control" id="password">
      <div class="form-text">Оставьте пустым, если не хотите менять пароль.</div>
    </div>

    <button type="submit" class="btn btn-primary">Сохранить изменения</button>
    <a th:href="@{/profile}" class="btn btn-secondary">Назад</a>
  </form>
</div>
</body>
</html>
