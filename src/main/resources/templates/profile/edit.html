<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Профиль пользователя</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-lg-8 col-md-10 text-center">
      <th:block th:replace="~{header :: header}"/>
        <form th:action="@{/profile/edit}" method="post" th:object="${userDto}">
          <input type="hidden" name="_method" value="patch"/>
          <input type="hidden" name="_method" value="patch"/>
          <div class="mb-3">
            <label for="email" class="form-label">Почта</label>
            <input type="email" th:field="*{email}" class="form-control" id="email" required>
              <div class="text-danger small" th:errors="*{email}"></div>
          </div>

          <div class="mb-3">
            <label for="firstName" class="form-label">Имя</label>
            <input type="text" th:field="*{firstName}" class="form-control" id="firstName">
            <div class="text-danger small" th:errors="*{firstName}"></div>
          </div>

          <div class="mb-3">
            <label for="lastName" class="form-label">Фамилия</label>
            <input type="text" th:field="*{lastName}" class="form-control" id="lastName">
            <div class="text-danger small" th:errors="*{lastName}"></div>
          </div>

          <button type="submit" class="btn btn-primary">Сохранить изменения</button>
          <a th:href="@{/profile}" class="btn btn-secondary">Назад</a>
        </form>
    </div>
  </div>
</div>
</body>
</html>
