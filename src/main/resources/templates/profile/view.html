<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Профиль пользователя</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<th:block th:replace="~{header :: header}"/>
<div class="container mt-5">
  <h1>Профиль</h1>

  <div class="card">
    <div class="card-body">
      <p><strong>Почта:</strong> <span th:text="${user.email}">email@example.com</span></p>
      <p><strong>Имя:</strong> <span th:text="${user.firstName}">firstname</span></p>
      <p><strong>Фамилия:</strong> <span th:text="${user.lastName}">lastname</span></p>

      <hr>
      <h5>Адрес</h5>
      <div th:if="${user.getAddress() != null}">
        <p><strong>Регион:</strong> <span th:text="${user.address.region}">Регион</span></p>
        <p><strong>Город:</strong> <span th:text="${user.address.city}">Город</span></p>
        <p><strong>Улица:</strong> <span th:text="${user.address.street}">Улица</span></p>
        <p><strong>Дом:</strong> <span th:text="${user.address.house}">Дом</span></p>
        <p><strong>Квартира:</strong> <span th:text="${user.address.apartment}">Кв.</span></p>
        <p><strong>Почтовый индекс:</strong> <span th:text="${user.address.postalCode}">000000</span></p>
        <a th:href="@{/profile/address/edit}" class="btn btn-primary">Изменить адрес</a>
        <form th:action="@{/profile/address/delete}" method="post" class="mt-3">
          <button type="submit" class="btn btn-danger"
                  onclick="return confirm('Вы уверены, что хотите удалить адрес?')">
            Удалить адрес
          </button>
        </form>
      </div>
      <div th:if="${user.getAddress() == null}" class="text-muted">
        <a href="/profile/address/create" class="btn btn-outline-primary">Добавить адрес</a>
      </div>
    </div>
  </div>

  <div class="mt-4">
    <a href="/profile/edit" class="btn btn-outline-primary">Редактировать данные</a>
    <a href="/order" class="btn btn-outline-primary">Мои заказы</a>
  </div>
</div>
</body>
</html>
