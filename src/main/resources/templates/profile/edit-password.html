<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Изменить пароль</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<th:block th:replace="~{header :: header}" />
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10 text-center">
            <h2 class="text-center mb-4">Изменение пароля</h2>

            <form th:action="@{/profile/edit-password}" method="post" th:object="${userDto}" class="card p-4 col-md-6 mx-auto">
                <input type="hidden" name="_method" value="patch" />

                <div class="mb-3">
                    <label for="currentPassword" class="form-label">Текущий пароль</label>
                    <input type="password" th:field="*{currentPassword}" class="form-control" id="currentPassword" required />
                    <div class="text-danger small" th:errors="*{currentPassword}"></div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Новый пароль</label>
                    <input type="password" th:field="*{password}" class="form-control" id="password" required minlength="8"/>
                    <div class="form-text">Минимум 8 символов</div>
                    <div class="text-danger small" th:errors="*{password}"></div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                </div>

                <div class="mt-3">
                    <a th:href="@{/profile}" class="btn btn-outline-secondary w-100">Назад в профиль</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
